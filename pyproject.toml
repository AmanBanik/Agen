[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agen-v2"
version = "0.3.0"
description = "Terminal Agent v2.0 - Autonomous AI CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "langchain>=0.2.0",
    "langchain-google-genai>=1.0.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "chromadb>=0.4.0",
    "langchain-community>=0.2.0",
    "mcp>=1.0.0",
    "pylatexenc>=2.10"
]

[project.scripts]
agen = "client.cli:main"

[tool.setuptools]
packages = ["backend", "client"]
