[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-agent"
version = "0.2.0"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.24.0",
]

[project.scripts]
agent = "client.cli:main"
agen = "client.cli:main"

[tool.setuptools]
packages = ["client"]
