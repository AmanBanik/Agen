name: Agen V2 CI

on:
  push:
    branches: [ "main", "v2-stable" ]
  pull_request:
    branches: [ "main", "v2-stable" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pyinstaller pytest cx_Freeze

    - name: Run Smoke Test
      run: |
        # Simply verifying the modules can be imported without crashing
        python -c "import backend.agent; import backend.swarm; import client.cli; print('Smoke test passed!')"

    - name: Build Executable
      run: |
        .\build_exe.bat
